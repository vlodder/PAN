<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#123C7A"/>
      <stop offset="52%" stop-color="#071B3A"/>
      <stop offset="100%" stop-color="#020814"/>
    </radialGradient>
    <linearGradient id="cyan" x1="238" y1="184" x2="786" y2="822" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DEBFF"/>
      <stop offset="0.55" stop-color="#1BA7FF"/>
      <stop offset="1" stop-color="#0066B3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.15 0 0 0 0 0.75 0 0 0 0 1 0 0 0 0.8 0"/>
      <feBlend in="SourceGraphic" mode="screen"/>
    </filter>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- subtle star field -->
    <g opacity="0.9">
      <circle cx="160" cy="179" r="3" fill="#BEEFFF"/>
      <circle cx="280" cy="125" r="2" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="746" cy="164" r="3" fill="#BEEFFF"/>
      <circle cx="855" cy="292" r="2" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="148" cy="764" r="2" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="820" cy="780" r="3" fill="#BEEFFF"/>
      <circle cx="610" cy="108" r="2" fill="#FFFFFF" opacity="0.65"/>
      <circle cx="421" cy="842" r="2" fill="#FFFFFF" opacity="0.65"/>
    </g>

    <!-- radar rings -->
    <g opacity="0.22" stroke="#66D9FF" stroke-width="8">
      <circle cx="512" cy="534" r="330"/>
      <circle cx="512" cy="534" r="236"/>
      <circle cx="512" cy="534" r="142"/>
      <path d="M512 204V864"/>
      <path d="M182 534H842"/>
    </g>

    <!-- orbit / GEIPAN reference -->
    <ellipse cx="512" cy="526" rx="394" ry="132" transform="rotate(-18 512 526)" stroke="url(#cyan)" stroke-width="28" opacity="0.95"/>
    <ellipse cx="512" cy="526" rx="290" ry="92" transform="rotate(-18 512 526)" stroke="#DDFBFF" stroke-width="6" opacity="0.25"/>

    <!-- PAN / UFO silhouette -->
    <g filter="url(#glow)">
      <path d="M284 512C334 438 438 395 538 410C638 425 725 493 750 555C668 604 533 621 410 591C350 576 306 551 284 512Z" fill="url(#cyan)"/>
      <path d="M348 516C408 476 541 458 662 515C607 548 450 562 348 516Z" fill="#E9FCFF" opacity="0.92"/>
      <path d="M414 427C456 360 558 349 618 430C564 418 482 415 414 427Z" fill="#A8F4FF" opacity="0.72"/>
      <circle cx="430" cy="566" r="14" fill="#E9FCFF"/>
      <circle cx="512" cy="581" r="16" fill="#E9FCFF"/>
      <circle cx="596" cy="570" r="14" fill="#E9FCFF"/>
    </g>

    <!-- location pin + observation point -->
    <g filter="url(#glow)">
      <path d="M512 727C512 727 426 630 426 556C426 508 465 469 512 469C559 469 598 508 598 556C598 630 512 727 512 727Z" fill="#0A1020" stroke="#7DEBFF" stroke-width="28"/>
      <circle cx="512" cy="555" r="34" fill="#7DEBFF"/>
    </g>

    <!-- horizon -->
    <path d="M210 760C302 720 378 728 464 760C548 792 636 806 814 748" stroke="#66D9FF" stroke-width="18" opacity="0.45" stroke-linecap="round"/>
    <path d="M232 801H792" stroke="#E9FCFF" stroke-width="8" opacity="0.22" stroke-linecap="round"/>

    <!-- small PAN label -->
    <text x="512" y="888" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="82" font-weight="800" letter-spacing="12" fill="#E9FCFF">PAN</text>
  </g>
</svg>
